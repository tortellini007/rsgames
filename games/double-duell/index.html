<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Double Duell</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #050510;
  overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none;
  width: 100vw; height: 100vh; height: 100dvh;
  position: relative;
}
canvas {
  position: absolute; display: block;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
#ui {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 0 14px 18px; pointer-events: none;
}
.ctrl-side { display: flex; align-items: flex-end; gap: 10px; pointer-events: auto; }
.joy-outer { position: relative; width: 96px; height: 96px; border-radius: 50%;
  background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.16);
  flex-shrink: 0; touch-action: none; }
.joy-inner { position: absolute; width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255,255,255,0.16); border: 2px solid rgba(255,255,255,0.32);
  top: 29px; left: 29px; pointer-events: none; }
.abtn-col { display: flex; flex-direction: column; gap: 8px; }
.abtn { width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.9); font-size: 9px; font-weight: bold;
  font-family: monospace; cursor: pointer; user-select: none; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; line-height: 1.2;
  touch-action: none; flex-shrink: 0; }
.abtn.jump  { border-color: rgba(100,180,255,0.5); }
.abtn.jump.active  { background: rgba(100,180,255,0.3); }
.abtn.shoot { border-color: rgba(255,80,200,0.6); width:74px; height:74px; font-size:11px; }
.abtn.shoot.active { background: rgba(255,80,200,0.3); }
.kbd { font-size: 7px; opacity: 0.4; margin-top: 1px; }
</style>
</head>
<body>
<canvas id="c" width="800" height="520"></canvas>
<div id="ui">
  <div class="ctrl-side" id="p1ctrl">
    <div class="joy-outer" id="joy1"><div class="joy-inner" id="joy1k"></div></div>
    <div class="abtn-col">
      <button class="abtn jump" id="b1j">JUMP<div class="kbd">W</div></button>
      <button class="abtn shoot" id="b1s">SPELL<div class="kbd">F</div></button>
    </div>
  </div>
  <div class="ctrl-side" id="p2ctrl" style="display:none">
    <div class="abtn-col" style="align-items:flex-end">
      <button class="abtn jump" id="b2j">JUMP<div class="kbd">↑</div></button>
      <button class="abtn shoot" id="b2s">SPELL<div class="kbd">L</div></button>
    </div>
    <div class="joy-outer" id="joy2"><div class="joy-inner" id="joy2k"></div></div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 520;

// ── CHARACTER SPRITES ────────────────────────────────────────────────────────
const sprites = {};
['blaze','nova','rusty','frost'].forEach(name => {
  sprites[name] = new Image();
  sprites[name].src = name + '_sprite.png';
});
const SPRITE_RATIO = { blaze:995/1145, nova:1109/1179, rusty:974/1145, frost:1278/1412 };

// ── ORB IMAGES & COLORS ───────────────────────────────────────────────────────
const ORB_NAMES  = ['blue','orange','purple','green','red'];
const ORB_COLORS = ['#3355ff','#ff6600','#bb00ff','#00cc88','#cc0000'];
const orbImgs = ORB_NAMES.map(n => { const i=new Image(); i.src=`orb_${n}.png`; return i; });

function drawSprite(name, w, h) {
  const img = sprites[name];
  if (!img.complete || !img.naturalWidth) return;
  const ratio = SPRITE_RATIO[name];
  const sw = ~~(h*ratio), sx = ~~(-(sw-w)/2);
  ctx.drawImage(img, sx, 0, sw, h);
}

// ── CHARACTER DATA ──────────────────────────────────────────────────────────
const CHARS = [
  { name:'Blaze',   sub:'Der Mutige', spell:'#ff3333', spd:3.5, jf:-11.0 },
  { name:'Nova', sub:'Die Kluge',        spell:'#cc44ff', spd:4.0, jf:-11.5 },
  { name:'Rusty',     sub:'Der Rote',         spell:'#ff8800', spd:3.0, jf:-10.5 },
  { name:'Frost',   sub:'Der Kühle',       spell:'#00eeff', spd:3.8, jf:-11.0 },
];

// ── PLATFORMS ───────────────────────────────────────────────────────────────
const PLATFORMS = [
  { x:  0, y:476, w:800, h:44 },
  { x: 40, y:390, w:170, h:16 },
  { x:310, y:310, w:180, h:16 },
  { x:590, y:390, w:170, h:16 },
  { x:135, y:222, w:140, h:16 },
  { x:525, y:222, w:140, h:16 },
  { x:325, y:148, w:150, h:16 },
];

// ── STARS ───────────────────────────────────────────────────────────────────
const stars = Array.from({length:90}, ()=>({
  x:Math.random()*W, y:Math.random()*(H*0.62),
  s:Math.random()<0.25?2:1, tw:Math.random()*Math.PI*2
}));

// ── STATE ───────────────────────────────────────────────────────────────────
let state='menu', gameMode='2p', botDiff=1;
let charSel=[0,1], selStep=0, menuSel=0, modeSel=0, winner=0;
let players=[], spells=[], particles=[], frame=0;
let orbItems=[], orbTimers=[];

// ── INPUT ───────────────────────────────────────────────────────────────────
const keys={};
document.addEventListener('keydown',e=>{ keys[e.key]=true;  e.preventDefault(); onKey(e.key); });
document.addEventListener('keyup',  e=>{ keys[e.key]=false; });
const p1inp={left:false,right:false,jump:false,shoot:false};
const p2inp={left:false,right:false,jump:false,shoot:false};

function onKey(k) {
  if (state==='menu') {
    if (k==='ArrowUp'||k==='w'||k==='W')   menuSel=Math.max(0,menuSel-1);
    if (k==='ArrowDown'||k==='s'||k==='S') menuSel=Math.min(1,menuSel+1);
    if (k==='Enter'||k===' ') { if(menuSel===0){state='charSelect';selStep=0;charSel=[0,1];}else state='controls'; }
  } else if (state==='charSelect') {
    let d=(k==='ArrowLeft'||k==='a'||k==='A')?-1:(k==='ArrowRight'||k==='d'||k==='D')?1:0;
    if(d) charSel[selStep]=(charSel[selStep]+d+CHARS.length)%CHARS.length;
    if(k==='Enter'||k===' '){if(selStep===0)selStep=1;else{state='modeSelect';modeSel=0;}}
    if(k==='Escape'){if(selStep===1)selStep=0;else state='menu';}
  } else if (state==='modeSelect') {
    if(k==='ArrowLeft'||k==='a'||k==='A') modeSel=Math.max(0,modeSel-1);
    if(k==='ArrowRight'||k==='d'||k==='D') modeSel=Math.min(1,modeSel+1);
    if(modeSel===1){
      if(k==='ArrowUp'||k==='w'||k==='W') botDiff=Math.max(0,botDiff-1);
      if(k==='ArrowDown'||k==='s'||k==='S') botDiff=Math.min(2,botDiff+1);
    }
    if(k==='Enter'||k===' '){gameMode=modeSel===0?'2p':'bot';startGame();}
    if(k==='Escape') state='charSelect';
  } else if (state==='win'||state==='controls') {
    if(k==='Enter'||k===' '||k==='Escape') state='menu';
  }
}

// ── SPELL & PARTICLE ────────────────────────────────────────────────────────
class Spell {
  constructor(x,y,vx,vy,col,owner){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.col=col;this.owner=owner;this.life=90;}
  update(){this.x+=this.vx;this.y+=this.vy;this.life--;}
  draw(){
    const a=Math.min(1,this.life/15);
    ctx.save(); ctx.globalAlpha=a; ctx.shadowBlur=16; ctx.shadowColor=this.col; ctx.fillStyle=this.col;
    ctx.fillRect(~~this.x-5,~~this.y-3,12,6); ctx.fillRect(~~this.x-3,~~this.y-5,8,10);
    ctx.globalAlpha=a*0.3; ctx.fillRect(~~(this.x-this.vx*2.5)-3,~~(this.y-this.vy*2.5)-2,8,5);
    ctx.restore();
  }
}
class Particle {
  constructor(x,y,col){this.x=x;this.y=y;this.col=col;this.vx=(Math.random()-0.5)*5;this.vy=(Math.random()-0.5)*5-2;this.life=30+~~(Math.random()*20);this.max=this.life;this.s=2+Math.random()*3;}
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.15;this.life--;}
  draw(){ctx.save();ctx.globalAlpha=(this.life/this.max)*0.9;ctx.shadowBlur=6;ctx.shadowColor=this.col;ctx.fillStyle=this.col;ctx.fillRect(~~(this.x-this.s/2),~~(this.y-this.s/2),~~this.s,~~this.s);ctx.restore();}
}

// ── PLAYER ──────────────────────────────────────────────────────────────────
class Player {
  constructor(x,charIdx,isP2=false){
    this.x=x; this.y=380; this.w=32; this.h=56;
    this.vx=0; this.vy=0; this.charIdx=charIdx; this.isP2=isP2;
    this.facing=isP2?-1:1; this.hp=5; this.maxHp=5; this.lives=3;
    this.onGround=false; this.shootCd=0;
    this.invincible=0; this.dead=false; this.wasJump=false; this.wf=0; this.wt=0;
    this.spellColor=null; this.spellAmmo=0; this.orbTypeIdx=-1;
  }
  get char(){return CHARS[this.charIdx];}
  hitbox(){return{x:this.x+3,y:this.y,w:this.w-6,h:this.h};}
  control(left,right,jump,shoot){
    if(this.dead)return;
    const c=this.char;
    if(left){this.vx-=0.9;if(this.vx<-c.spd)this.vx=-c.spd;this.facing=-1;}
    else if(right){this.vx+=0.9;if(this.vx>c.spd)this.vx=c.spd;this.facing=1;}
    else{this.vx*=0.72;if(Math.abs(this.vx)<0.1)this.vx=0;}
    if(jump&&!this.wasJump&&this.onGround){this.vy=c.jf;this.onGround=false;}
    this.wasJump=jump;
    if(this.shootCd>0)this.shootCd--;
    if(shoot&&this.shootCd===0&&this.spellAmmo>0){this.shoot();this.shootCd=26;}
  }
  shoot(){
    const wx=this.x+(this.facing>0?this.w+8:-8);
    const wy=this.y+~~(this.h*0.62);
    spells.push(new Spell(wx,wy,this.facing*8.5,0,this.spellColor,this));
    this.spellAmmo--;
    if(this.spellAmmo<=0){this.spellColor=null;this.orbTypeIdx=-1;}
  }
  update(){
    if(this.dead)return;
    this.vy+=0.5; if(this.vy>16)this.vy=16;
    this.x+=this.vx; this.y+=this.vy;
    this.onGround=false;
    const hb=this.hitbox();
    for(const p of PLATFORMS){
      if(hb.x+hb.w>p.x&&hb.x<p.x+p.w){
        const bot=this.y+this.h;
        if(this.vy>=0&&bot>p.y&&bot<p.y+p.h+14&&this.y<p.y+p.h){
          this.y=p.y-this.h;this.vy=0;this.onGround=true;
        }
      }
    }
    if(this.x<0){this.x=0;this.vx=0;}
    if(this.x+this.w>W){this.x=W-this.w;this.vx=0;}
    if(this.y>H+80){this.lives--;if(this.lives<=0){this.dead=true;return;}this.respawn();}
    if(this.invincible>0)this.invincible--;
    if(this.onGround&&Math.abs(this.vx)>0.5){this.wt++;if(this.wt%9===0)this.wf^=1;}
    else{this.wf=0;this.wt=0;}
  }
  respawn(){this.x=this.isP2?W-160:110;this.y=300;this.vy=0;this.vx=0;this.hp=this.maxHp;this.invincible=120;this.dead=false;}
  takeDamage(col){
    if(this.invincible>0)return;
    this.hp--;this.invincible=42;
    for(let i=0;i<8;i++)particles.push(new Particle(this.x+this.w/2,this.y+this.h/2,col));
    if(this.hp<=0){this.lives--;if(this.lives<=0){this.dead=true;return;}this.respawn();}
  }
  draw(){
    if(this.dead)return;
    if(this.invincible>0&&Math.floor(this.invincible/4)%2===0)return;
    drawCharacter(this.charIdx,this.x,this.y,this.w,this.h,this.facing,false,this.wf);
    const bw=44,bh=6,bx=this.x+(this.w-bw)/2,by=this.y-16;
    ctx.fillStyle='#111'; ctx.fillRect(~~bx-1,~~by-1,bw+2,bh+2);
    ctx.fillStyle=this.hp>3?'#33ff66':this.hp>1?'#ffcc00':'#ff3333';
    ctx.fillRect(~~bx,~~by,~~((this.hp/this.maxHp)*bw),bh);
    ctx.strokeStyle='#444'; ctx.lineWidth=1; ctx.strokeRect(~~bx,~~by,bw,bh);
    for(let i=0;i<this.lives;i++){ctx.fillStyle='#fff';ctx.fillRect(~~bx+i*10,~~by-9,7,4);}
  }
}

// ── BOT PLATFORM PATHFINDING ─────────────────────────────────────────────────
// Platforms: 0=ground(y=476) 1=low-left(y=390,x=40-210) 2=middle(y=310,x=310-490)
//            3=low-right(y=390,x=590-760) 4=high-left(y=222,x=135-275)
//            5=high-right(y=222,x=525-665) 6=top(y=148,x=325-475)
// Each entry: which platforms are reachable in one jump (max ~121px height gain)
const PLAT_LINKS=[[1,3],[0,2],[1,3,4,5],[0,2],[2,6],[2,6],[4,5]];

function bfsPlatform(from,to){
  if(from===to)return[to];
  const prev=new Array(7).fill(-1),vis=new Array(7).fill(false);
  vis[from]=true;const q=[from];
  while(q.length){
    const c=q.shift();
    for(const n of PLAT_LINKS[c]){
      if(vis[n])continue;vis[n]=true;prev[n]=c;
      if(n===to){const p=[];let x=to;while(x!==-1){p.unshift(x);x=prev[x];}return p;}
      q.push(n);
    }
  }
  return[from];
}
// Returns platform index only when actually standing on one; -1 when airborne
function getPlatIdxAt(cx,cy){
  for(let i=0;i<PLATFORMS.length;i++){
    const p=PLATFORMS[i];
    if(cx>=p.x-4&&cx<=p.x+p.w+4&&Math.abs(cy-p.y)<22)return i;
  }
  return -1;
}
function getOrbPlatIdx(orb){
  let best=0,bd=999;
  for(let i=0;i<PLATFORMS.length;i++){
    const p=PLATFORMS[i];
    if(orb.x>=p.x-20&&orb.x<=p.x+p.w+20){
      const d=Math.abs((orb.y+22)-p.y);
      if(d<bd){bd=d;best=i;}
    }
  }
  return best;
}
// Ideal X to stand at on fromPI before jumping/moving to toPI
function launchX(fromPI,toPI){
  const from=PLATFORMS[fromPI],to=PLATFORMS[toPI];
  if(fromPI===0) return to.x+to.w/2; // on ground: stand under target, jump straight up
  const toCX=to.x+to.w/2,fromCX=from.x+from.w/2;
  return toCX>fromCX ? from.x+from.w-16 : from.x+16;
}

// ── BOT AI ──────────────────────────────────────────────────────────────────
class BotPlayer extends Player {
  constructor(x,charIdx){
    super(x,charIdx,true);
    this.tick=0;
    this.aL=false;this.aR=false;this.aJ=false;this.aS=false;
    this.stuckTimer=0;this.lastX=0;
    this.groundPI=0;
    this._targetOrb=null; // reference to the orb we're currently chasing
  }
  // Navigate toward targetPI using BFS. Must only be called when on ground.
  _navToPlat(targetPI, fallbackDx){
    const path=bfsPlatform(this.groundPI, targetPI);
    if(path.length<=1){
      // Already on target platform — walk toward the orb
      this.aL=fallbackDx<-10; this.aR=fallbackDx>10;
      return;
    }
    const nextPI=path[1], nextPlat=PLATFORMS[nextPI];
    const cx=this.x+this.w/2;
    const feetY=this.y+this.h;

    if(nextPlat.y >= feetY-30){
      // Next step is same level or below — walk toward it and fall naturally
      this.aL=fallbackDx<-12; this.aR=fallbackDx>12;
      this.facing=fallbackDx>0?1:-1;
      return;
    }

    // ── Next step is ABOVE: need to jump ──────────────────────────────────
    const underTarget=cx >= nextPlat.x+8 && cx <= nextPlat.x+nextPlat.w-8;

    if(underTarget){
      // Already under the target: jump STRAIGHT UP — zero horizontal so we
      // don't drift past the platform edge (the bug that caused the loop)
      this.aL=false; this.aR=false; this.aJ=true;
    } else {
      // Walk to the launch edge of the current platform, then jump
      // with horizontal velocity aimed at the target platform's center
      const wx=launchX(this.groundPI, nextPI);
      const dx=wx-cx;
      if(Math.abs(dx)<45){
        // At the launch edge: jump toward target center with horizontal
        const toCX=nextPlat.x+nextPlat.w/2;
        this.aL=toCX<cx-5; this.aR=toCX>cx+5;
        this.aJ=true;
      } else {
        // Still walking to launch edge
        this.aL=dx<-12; this.aR=dx>12;
        this.facing=dx>0?1:-1;
      }
    }
  }

  updateAI(t){
    if(this.dead)return;
    this.tick++;
    const react=[18,9,3][botDiff], range=[200,280,380][botDiff],
          agg=[0.3,0.6,0.9][botDiff];

    // Track ground platform — only when actually touching one
    if(this.onGround){
      const pi=getPlatIdxAt(this.x+this.w/2, this.y+this.h);
      if(pi>=0) this.groundPI=pi;
    }

    // Stuck detection: only count when on ground AND not having just jumped
    if(this.tick%20===0&&this.onGround&&!this.aJ){
      if(Math.abs(this.x-this.lastX)<3) this.stuckTimer++;
      else this.stuckTimer=0;
      this.lastX=this.x;
    }
    if(this.onGround&&Math.abs(this.x-this.lastX)>10) this.stuckTimer=0; // moving — reset
    const stuck=this.stuckTimer>=4;

    // ── INSTANT REACTIONS (every frame, no tick delay) ──────────────────────
    // 1. Ammo just hit 0 → stop shooting, immediately start orb hunt
    if(this.spellAmmo===0 && this.aS){
      this.aS=false;
      this._targetOrb=null;
      this.aL=false; this.aR=false;
    }
    // 2. Target orb was collected by opponent → stop and re-target
    if(this.spellAmmo===0 && this._targetOrb && !orbItems.includes(this._targetOrb)){
      this._targetOrb=null;
      this.aL=false; this.aR=false;
    }
    // 3. Have no target yet but orbs exist and we're on ground → pick one now
    if(this.spellAmmo===0 && !this._targetOrb && orbItems.length>0 && this.onGround){
      const near=orbItems.reduce((a,b)=>
        Math.hypot(b.x-this.x,b.y-this.y)<Math.hypot(a.x-this.x,a.y-this.y)?b:a
      );
      this._targetOrb=near;
      this.aL=false; this.aR=false;
      this._navToPlat(getOrbPlatIdx(near), near.x-(this.x+this.w/2));
    }

    if(this.tick%react===0){
      this.aJ=false; this.aS=false;

      if(this.spellAmmo===0&&orbItems.length>0){
        // ── ORB CHASE ──────────────────────────────────────────────────────────
        // aL/aR only updated on ground — bot never reverses mid-jump
        if(this.onGround){
          this.aL=false; this.aR=false;
          const near=orbItems.reduce((a,b)=>
            Math.hypot(b.x-this.x,b.y-this.y)<Math.hypot(a.x-this.x,a.y-this.y)?b:a
          );
          this._targetOrb=near; // remember which orb we're heading to
          const odx=near.x-(this.x+this.w/2);
          this._navToPlat(getOrbPlatIdx(near), odx);
          if(stuck){ this.aJ=true; this.stuckTimer=0; }
        }
        // airborne → keep aL/aR from launch tick

      } else if(this.spellAmmo===0){
        // ── NO AMMO, NO ORBS — evade, never jump ──────────────────────────────
        this._targetOrb=null;
        if(this.onGround){
          this.aL=false; this.aR=false;
          const dx=t.x-this.x;
          this.aL=dx>0; this.aR=dx<0;
        }

      } else {
        // ── COMBAT (has ammo) ──────────────────────────────────────────────────
        this._targetOrb=null;
        this.aL=false; this.aR=false;
        const dx=t.x-this.x, dy=t.y-this.y, dist=Math.abs(dx);
        this.facing=dx>0?1:-1;

        // Find which platform the player is currently standing on
        let tPI=-1;
        const tCX=t.x+t.w/2, tCY=t.y+t.h;
        for(let i=0;i<PLATFORMS.length;i++){
          const p=PLATFORMS[i];
          if(tCX>=p.x-4&&tCX<=p.x+p.w+4&&Math.abs(tCY-p.y)<22){tPI=i;break;}
        }

        if(this.onGround){
          if(tPI>=0 && tPI!==this.groundPI){
            // Player is on a different platform — navigate there via BFS
            this._navToPlat(tPI, dx);
          } else {
            // Same platform (or player airborne) — hold ideal shooting range
            const ideal=120+~~((1-agg)*130); // 133px hard ↔ 251px easy
            if(dist > ideal+50){ this.aL=dx<0; this.aR=dx>0; }
            else if(dist < ideal-40){ this.aL=dx>0; this.aR=dx<0; }
            // within range: stand still and shoot
          }
          if(stuck){ this.aJ=true; this.stuckTimer=0; }
        }

        // Shoot when aligned (only randomness left — controls fire cadence)
        if(dist<range && Math.abs(dy)<90 && Math.random()<agg) this.aS=true;
      }
    }
    this.control(this.aL,this.aR,this.aJ,this.aS);
    this.update();
  }
}

// ════════════════════════════════════════════════════════════════════════════
//  CHARACTER PIXEL-ART DRAWING
// ════════════════════════════════════════════════════════════════════════════
function drawCharacter(idx,x,y,w,h,facing,ducking,wf){
  ctx.save();
  ctx.translate(~~x,~~y);
  if(facing<0){ctx.translate(w,0);ctx.scale(-1,1);}

}

function drawHat(cx,y,brimW,bodyH,col,patchCol,trim){

function dTower(cx,y,tw,th,pointy,col,out){

}

// ── ORB SYSTEM ───────────────────────────────────────────────────────────────
function spawnOrb(){
  const pls=PLATFORMS.slice(1); // skip ground
  const p=pls[~~(Math.random()*pls.length)];
  const x=p.x+24+Math.random()*(p.w-48);
  const y=p.y-22;
  orbItems.push({x,y,typeIdx:~~(Math.random()*ORB_NAMES.length),bob:Math.random()*Math.PI*2});
}
function initOrbs(){
  orbItems=[];orbTimers=[];
  for(let i=0;i<4;i++) spawnOrb();
}
function drawOrbs(){
  const S=26;
  for(const orb of orbItems){
    const img=orbImgs[orb.typeIdx];
    if(!img.complete||!img.naturalWidth) continue;
    orb.bob+=0.05;
    const by=orb.y+Math.sin(orb.bob)*4;
    ctx.save();
    ctx.shadowBlur=14; ctx.shadowColor=ORB_COLORS[orb.typeIdx];
    ctx.drawImage(img,~~(orb.x-S/2),~~(by-S/2),S,S);
    ctx.restore();
  }
}

// ── GAME LOGIC ───────────────────────────────────────────────────────────────
function startGame(){
  spells=[];particles=[];frame=0;
  players[0]=new Player(100,charSel[0],false);
  players[1]=gameMode==='bot'?new BotPlayer(W-148,charSel[1]):new Player(W-148,charSel[1],true);
  document.getElementById('p2ctrl').style.display=gameMode==='2p'?'flex':'none';
  initOrbs();
  state='game';
}

function update(){
  if(state!=='game')return;
  frame++;
  const p1=players[0],p2=players[1];
  p1.control(!!(keys['a']||keys['A']||p1inp.left),!!(keys['d']||keys['D']||p1inp.right),
             !!(keys['w']||keys['W']||p1inp.jump),
             !!(keys['f']||keys['F']||keys['Control']||p1inp.shoot));
  p1.update();
  if(gameMode==='bot')p2.updateAI(p1);
  else{
    p2.control(!!(keys['ArrowLeft']||p2inp.left),!!(keys['ArrowRight']||p2inp.right),
               !!(keys['ArrowUp']||p2inp.jump),
               !!(keys['l']||keys['L']||keys['Enter']||p2inp.shoot));
    p2.update();
  }
  // ── Orb pickup ──
  orbItems=orbItems.filter(orb=>{
    for(const pl of players){
      if(pl.dead)continue;
      const dx=(pl.x+pl.w/2)-orb.x, dy=(pl.y+pl.h/2)-orb.y;
      if(Math.abs(dx)<22&&Math.abs(dy)<22){
        pl.spellColor=ORB_COLORS[orb.typeIdx];
        pl.spellAmmo=5; pl.orbTypeIdx=orb.typeIdx;
        orbTimers.push(180+~~(Math.random()*300));
        return false;
      }
    }
    return true;
  });
  for(let i=orbTimers.length-1;i>=0;i--){
    if(--orbTimers[i]<=0){orbTimers.splice(i,1);spawnOrb();}
  }
  spells=spells.filter(s=>s.life>0);
  for(const sp of spells){
    sp.update();
    for(const pl of players){
      if(sp.owner===pl)continue;
      const hb=pl.hitbox();
      if(sp.x>hb.x&&sp.x<hb.x+hb.w&&sp.y>hb.y&&sp.y<hb.y+hb.h){pl.takeDamage(sp.col);sp.life=0;}
    }
    for(const s2 of spells){
      if(s2===sp||s2.owner===sp.owner||sp.life<=0)continue;
      if(Math.abs(sp.x-s2.x)<10&&Math.abs(sp.y-s2.y)<10){
        for(let i=0;i<6;i++)particles.push(new Particle(sp.x,sp.y,'#ffffff'));
        sp.life=0;s2.life=0;
      }
    }
  }
  particles=particles.filter(p=>p.life>0);
  for(const p of particles)p.update();
  if(p1.dead&&!p2.dead){winner=2;state='win';}
  else if(p2.dead&&!p1.dead){winner=1;state='win';}
  else if(p1.dead&&p2.dead){winner=0;state='win';}
}

function draw(){
  ctx.clearRect(0,0,W,H);
  if(state==='menu')      {drawMenu();return;}
  if(state==='charSelect'){drawCharSelect();return;}
  if(state==='modeSelect'){drawModeSelect();return;}
  if(state==='controls')  {drawControlsScreen();return;}
  drawBackground();drawPlatforms();
  drawOrbs();
  for(const p of particles)p.draw();
  for(const s of spells)s.draw();
  for(const pl of players)pl.draw();
  drawHUD();
  if(state==='win')drawWinScreen();
}

function gameLoop(){menuInput();update();draw();requestAnimationFrame(gameLoop);}

function setupJoystick(joyEl,knobEl,inp){
  let active=false,tid=null,ox=0,oy=0;const R=44;
  function start(tx,ty,id){active=true;tid=id;const rc=joyEl.getBoundingClientRect();ox=rc.left+rc.width/2;oy=rc.top+rc.height/2;move(tx,ty);}
  function move(tx,ty){if(!active)return;let dx=tx-ox,dy=ty-oy;const d=Math.sqrt(dx*dx+dy*dy);if(d>R){dx=dx/d*R;dy=dy/d*R;}knobEl.style.left=(48+dx-19)+'px';knobEl.style.top=(48+dy-19)+'px';inp.left=dx<-12;inp.right=dx>12;inp.jump=dy<-20;inp.down=dy>20;}
  function end(){active=false;tid=null;knobEl.style.left='29px';knobEl.style.top='29px';inp.left=inp.right=inp.jump=inp.down=false;}
  joyEl.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];start(t.clientX,t.clientY,t.identifier);},{passive:false});
  document.addEventListener('touchmove',e=>{if(!active)return;for(const t of e.changedTouches)if(t.identifier===tid){move(t.clientX,t.clientY);break;}},{passive:false});
  document.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===tid){end();break;}});
  joyEl.addEventListener('mousedown',e=>{start(e.clientX,e.clientY,-1);e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(active)move(e.clientX,e.clientY);});
  document.addEventListener('mouseup',()=>{if(active)end();});
}
function setupBtn(id,inp,prop){
  const el=document.getElementById(id);if(!el)return;
  const on=()=>{inp[prop]=true;el.classList.add('active');};
  const off=()=>{inp[prop]=false;el.classList.remove('active');};
  el.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();off();},{passive:false});
  el.addEventListener('mousedown',e=>{e.preventDefault();on();});
  el.addEventListener('mouseup',()=>off());el.addEventListener('mouseleave',()=>off());
}
setupJoystick(document.getElementById('joy1'),document.getElementById('joy1k'),p1inp);
setupJoystick(document.getElementById('joy2'),document.getElementById('joy2k'),p2inp);
['b1j','b1s','b2j','b2s'].forEach((id,i)=>{
  const inpArr=[p1inp,p1inp,p2inp,p2inp];
  const props=['jump','shoot','jump','shoot'];
  setupBtn(id,inpArr[i],props[i]);
});
document.addEventListener('dblclick',e=>e.preventDefault());

// ── MOBILE SCALE ─────────────────────────────────────────────────────────────
function fitCanvas(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const scale=Math.min(vw/W, vh/H);
  const cw=~~(W*scale), ch=~~(H*scale);
  canvas.style.width =cw+'px';
  canvas.style.height=ch+'px';
  canvas.style.left  =~~((vw-cw)/2)+'px';
  canvas.style.top   =~~((vh-ch)/2)+'px';
}
window.addEventListener('resize',fitCanvas);
window.addEventListener('orientationchange',()=>setTimeout(fitCanvas,150));
setTimeout(fitCanvas,50);

// ── MOBILE MENU NAVIGATION ────────────────────────────────────────────────────
let menuNavCd=0;
function menuInput(){
  if(state==='game'){menuNavCd=0;return;}
  if(menuNavCd>0){menuNavCd--;return;}
  if(p1inp.left) {onKey('ArrowLeft'); menuNavCd=16;}
  else if(p1inp.right){onKey('ArrowRight');menuNavCd=16;}
  else if(p1inp.jump) {onKey('ArrowUp');  menuNavCd=16;}
  else if(p1inp.down) {onKey('ArrowDown');menuNavCd=16;}
  else if(p1inp.shoot){onKey(' ');        menuNavCd=20;}
}

// Tap canvas to confirm in menus
canvas.addEventListener('touchend',e=>{
  if(state!=='game'){e.preventDefault();onKey(' ');}
},{passive:false});

gameLoop();
</script>
