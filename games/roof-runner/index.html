<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1446">
<title>Dachlauf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dachlauf">
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --ink: #ffffff;
    --ink-soft: rgba(255,255,255,.78);
    --chip: rgba(0,0,0,.28);
    --gold: #ffd23f;
    --btn-bg: #ffd23f;
    --btn-ink: #2a1650;
    --page: #1b1446;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #140f36; }
  }
  :root[data-theme="dark"] { --page: #140f36; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--page); color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
    font-family: Nunito, system-ui, sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .display { font-family: "Rubik Mono One", "Arial Black", Impact, sans-serif; font-weight: 400; }
  .coin {
    display: inline-block; width: .95em; height: .95em; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff1a8, #ffd23f 45%, #d99a14);
    box-shadow: inset 0 0 0 2px #b07a12; vertical-align: -.14em; margin-right: .3em;
  }

  #hud {
    position: fixed; top: 0; left: 0; right: 0; pointer-events: none; text-align: center;
    padding-top: calc(env(safe-area-inset-top, 0px) + 18px); transition: opacity .25s;
  }
  #hud.hidden { opacity: 0; }
  #dist { font-size: clamp(40px, 12vw, 64px); line-height: 1; text-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #dist small { font-size: .45em; margin-left: .15em; }
  #coins { margin-top: 8px; font-weight: 800; font-size: 18px; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  #pop {
    position: fixed; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none;
    font-size: clamp(24px, 7.5vw, 40px); opacity: 0; text-shadow: 0 4px 0 rgba(0,0,0,.3); padding: 0 16px;
  }
  #pop small { display: block; font-family: Nunito, system-ui, sans-serif; font-weight: 800; font-size: 15px; margin-bottom: 6px; color: var(--ink-soft); }
  #pop.show { animation: popIn 1.6s ease-out forwards; }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(.7); }
    12% { opacity: 1; transform: scale(1.08); }
    75% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: translateY(-12px); }
  }

  #mute, #music {
    position: fixed; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 14px);
    width: 44px; height: 44px; border-radius: 50%; border: 0; z-index: 5;
    background: var(--chip); color: var(--ink); cursor: pointer;
    display: grid; place-items: center; padding: 0;
  }
  #mute svg, #music svg { width: 22px; height: 22px; }
  #music { right: 66px; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  #hints {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 12vh);
    display: flex; pointer-events: none; transition: opacity .6s; font-weight: 800; font-size: 15px;
  }
  #hints.hidden { opacity: 0; }
  #hints div { flex: 1; text-align: center; }
  #hints span { background: rgba(0,0,0,.4); padding: 10px 14px; border-radius: 999px; }

  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 22px calc(env(safe-area-inset-bottom, 0px) + 24px);
    pointer-events: none; transition: opacity .35s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .panel {
    background: rgba(10, 6, 30, .55); border-radius: 28px; padding: 26px 20px 24px;
    width: min(100%, 420px); display: flex; flex-direction: column; align-items: center;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .overlay h1 { font-size: clamp(34px, 11vw, 60px); line-height: 1; margin: 0; text-shadow: 0 5px 0 rgba(0,0,0,.3); }
  .overlay p { margin: 12px 0 0; font-weight: 600; font-size: 15px; color: var(--ink-soft); max-width: 32ch; line-height: 1.45; }
  .overlay .stat { font-weight: 800; font-size: 17px; color: var(--ink); margin-top: 10px; }
  .overlay .gold { color: var(--gold); }
  .label { margin-top: 18px; font-weight: 800; font-size: 14px; color: var(--ink-soft); }
  .tap { font-size: 16px; margin-top: 22px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  #scarves { display: flex; gap: 10px; margin-top: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
  .sw { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; color: var(--ink-soft); min-width: 40px; }
  .sw button { width: 38px; height: 38px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .sw button.sel { border-color: #fff; }
  .sw.locked button { opacity: .35; }
  .sw.confirm button { opacity: 1; border-color: var(--gold); }
  .sw.confirm span { color: var(--gold); }
  .sw.rainbow button { background: conic-gradient(#ff4d6d, #ffd23f, #7dff6a, #4dd4ff, #b06bff, #ff4d6d); }

  #worlds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; width: 100%; pointer-events: auto; }
  #worlds button {
    border: 2px solid transparent; border-radius: 14px; padding: 9px 4px; cursor: pointer;
    font: 800 12px Nunito, system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  #worlds button.sel { border-color: #fff; }
  #worlds button.locked { filter: saturate(.35) brightness(.6); }
  #worlds button.confirm { filter: none; border-color: var(--gold); }
  #worlds .coin { width: 1em; height: 1em; }
  #shopMsg { margin-top: 8px; min-height: 20px; font-weight: 800; font-size: 14px; color: var(--gold); }

  .btn {
    pointer-events: auto; cursor: pointer; border: 0; border-radius: 999px; margin-top: 22px;
    font-family: "Rubik Mono One", "Arial Black", sans-serif; font-size: 16px;
    padding: 16px 28px; background: var(--btn-bg); color: var(--btn-ink);
    box-shadow: 0 6px 0 rgba(0,0,0,.3);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .link { pointer-events: auto; cursor: pointer; margin-top: 10px; background: none; border: 0; color: var(--ink-soft); font: 800 15px Nunito, system-ui, sans-serif; padding: 10px 16px; text-decoration: underline; text-underline-offset: 4px; }
  #unlock { color: var(--gold); font-weight: 800; margin-top: 10px; min-height: 20px; font-size: 15px; }
  @media (prefers-reduced-motion: reduce) { .tap, #pop.show { animation: none; } #pop.show { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="dist" class="display">0<small>m</small></div>
  <div id="coins"><i class="coin"></i>0</div>
</div>
<div id="pop" class="display"></div>
<div id="hints" class="hidden">
  <div><span>Links halten: rutschen</span></div>
  <div><span>Rechts tippen: springen</span></div>
</div>

<button id="music" aria-label="Musik an oder aus"></button>
<button id="mute" aria-label="Geräusche an oder aus"></button>

<div id="menu" class="overlay">
  <div class="panel">
    <h1 class="display">Dachlauf</h1>
    <p>Rechts tippen zum Springen, halten für mehr Höhe, in der Luft nochmal für einen Salto. Links halten zum Rutschen.</p>
    <div class="stat" id="menuStats"></div>
    <div id="shopMsg"></div>
    <div class="label">Welt</div>
    <div id="worlds"></div>
    <div class="label">Schal</div>
    <div id="scarves"></div>
    <div class="tap display">Tippe zum Starten</div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="panel">
    <p id="reason" style="margin-top:0">Abgestürzt</p>
    <h1 class="display" id="finalDist">0 m</h1>
    <div class="stat" id="overBest"></div>
    <div class="stat gold" id="overCoins"></div>
    <div id="unlock"></div>
    <button class="btn" id="again">Nochmal laufen</button>
    <button class="link" id="toMenu">Zum Shop: Welten und Schals</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const COIN = '<i class="coin"></i>';

  // ---------- Welten ----------
  const WORLDS = [
    { name: 'Abendstadt', cost: 0, sky: ['#1b1446','#5e2a78','#d9567a','#ff9a5c'], sun: '#ffcf7a', sunR: 120, far: '#4a2a6e', near: '#33205a', win: '#ffd68c', roof: '#1f1740', edge: '#7a64b0', lip: '#2b2156', rwin: '#ffd68c', box: '#6f7fae', boxTop: '#a9b6dd', sign: '#ffd23f', stripe: '#1b1446', cable: '#151030', stars: 0.5, weather: 'none', grav: 1 },
    { name: 'Neonnacht', cost: 100, sky: ['#05030f','#120a2e','#2a0d4a','#4a1066'], sun: '#e9f0ff', sunR: 55, far: '#1d1240', near: '#120b2a', win: '#3df2ff', roof: '#0b0819', edge: '#ff3df2', lip: '#1a0f33', rwin: '#3df2ff', box: '#1e2a52', boxTop: '#3df2ff', sign: '#ff3df2', stripe: '#0b0819', cable: '#2a1f55', stars: 0.8, weather: 'rain', grav: 1 },
    { name: 'Schneegipfel', cost: 200, sky: ['#2b4a7a','#5f87b8','#a9c7e6','#e8f1fb'], sun: '#fff8e0', sunR: 90, far: '#9cb4d2', near: '#7590b5', win: '#ffe9a8', roof: '#3d4f6e', edge: '#f4f8ff', lip: '#2f3e59', rwin: '#ffe9a8', box: '#8a6b55', boxTop: '#f4f8ff', sign: '#e8433f', stripe: '#ffffff', cable: '#2f3e59', stars: 0, weather: 'snow', grav: 1 },
    { name: 'Dschungeltempel', cost: 350, sky: ['#0f2a1e','#1f5a3a','#5f9a4a','#d8e07a'], sun: '#fff3a0', sunR: 100, far: '#2a5a3a', near: '#1a3f2a', win: '#ffd86b', roof: '#3a3a2a', edge: '#8fae5a', lip: '#2a2a1e', rwin: '#ffd86b', box: '#7a6a4a', boxTop: '#a6c56a', sign: '#c9a227', stripe: '#3a2a10', cable: '#2a3a1a', stars: 0, weather: 'fireflies', grav: 1 },
    { name: 'Lavawerk', cost: 500, sky: ['#1a0505','#4a0f0a','#a3260f','#ff7a1a'], sun: '#ffd27a', sunR: 130, far: '#3a0c0a', near: '#260707', win: '#ff9d2e', roof: '#1c1210', edge: '#ff5a1f', lip: '#2a1714', rwin: '#ff9d2e', box: '#4a4a52', boxTop: '#ff8a3d', sign: '#ffb020', stripe: '#1c1210', cable: '#120a08', stars: 0, weather: 'embers', grav: 1 },
    { name: 'Orbitstation', cost: 750, sky: ['#000000','#0a0a24','#1a1a4a','#3a2f7a'], sun: '#7ad0ff', sunR: 160, far: '#1a1f3a', near: '#12162c', win: '#8ef0c8', roof: '#1b2033', edge: '#c8d2ff', lip: '#262c45', rwin: '#8ef0c8', box: '#3a4466', boxTop: '#8ef0c8', sign: '#8ef0c8', stripe: '#12162c', cable: '#2a3050', stars: 1, weather: 'none', grav: 0.8 }
  ];
  const KEYS = ['sun','far','near','win','roof','edge','lip','rwin','box','boxTop','sign','stripe','cable'];
  const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const palOf = w => { const o = { sky: w.sky.map(hex), sunR: w.sunR, stars: w.stars }; KEYS.forEach(k => o[k] = hex(w[k])); return o; };
  const lerp3 = (a, b, k) => { a[0] += (b[0]-a[0])*k; a[1] += (b[1]-a[1])*k; a[2] += (b[2]-a[2])*k; };
  const rgb = (c, a = 1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
  let pal = palOf(WORLDS[0]), targetPal = palOf(WORLDS[0]);

  // ---------- Speicher ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let best = parseInt(store.get('dl-best', '0'), 10) || 0;
  let bank = parseInt(store.get('dl-coins', '0'), 10) || 0;
  let muted = store.get('dl-muted', '0') === '1';
  let scarfIdx = parseInt(store.get('dl-scarf', '0'), 10) || 0;
  let worldMask = parseInt(store.get('dl-worlds', '1'), 10) || 1;
  let startWorld = parseInt(store.get('dl-start', '0'), 10) || 0;
  if (!(worldMask & (1 << startWorld))) startWorld = 0;

  const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  const setMuteIcon = () => { $('mute').innerHTML = muted ? ICON_OFF : ICON_ON; };
  setMuteIcon();
  let musicOn = store.get('dl-music', '1') === '1';
  const NOTE_ON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4h10v4h-8v10a3.5 3.5 0 1 1-2-3.16V4z"/></svg>';
  const NOTE_OFF = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4h10v4h-8v10a3.5 3.5 0 1 1-2-3.16V4z" opacity=".55"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const setMusicIcon = () => { $('music').innerHTML = musicOn ? NOTE_ON : NOTE_OFF; };
  setMusicIcon();

  const SCARVES = [
    { c: '#ff4d6d', cost: 0 }, { c: '#4dd4ff', cost: 30 }, { c: '#7dff6a', cost: 80 },
    { c: '#ffd23f', cost: 150 }, { c: '#b06bff', cost: 250 }, { c: 'rainbow', cost: 400 }
  ];
  let scarfMask = parseInt(store.get('dl-scarfmask', '-1'), 10);
  if (!(scarfMask >= 1)) { scarfMask = 0; SCARVES.forEach((s, i) => { if (s.cost <= bank) scarfMask |= (1 << i); }); store.set('dl-scarfmask', String(scarfMask)); }
  if (!(scarfMask & (1 << scarfIdx))) scarfIdx = 0;
  let pending = null;
  const fmt = n => n.toLocaleString('de-DE');
  function shopMsg(t) { $('shopMsg').innerHTML = t || ''; }
  function buy(cost) {
    bank -= cost; store.set('dl-coins', String(bank));
    [660, 880, 1175].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'triangle', 0.12), i * 70));
    buzz(25);
  }
  function tooPoor(cost) {
    pending = null;
    shopMsg(`Dir fehlen noch ${COIN}${fmt(cost - bank)}`);
    tone(150, 0.15, 'square', 0.06);
  }

  function renderMenu() {
    const wrap = $('scarves');
    wrap.innerHTML = '';
    SCARVES.forEach((sc, i) => {
      const owned = !!(scarfMask & (1 << i));
      const key = 's' + i;
      const d = document.createElement('div');
      d.className = 'sw' + (sc.c === 'rainbow' ? ' rainbow' : '') + (owned ? '' : ' locked') + (pending === key ? ' confirm' : '');
      const b = document.createElement('button');
      if (sc.c !== 'rainbow') b.style.background = sc.c;
      b.setAttribute('aria-label', owned ? 'Schal wählen' : `Schal kaufen für ${sc.cost} Münzen`);
      if (owned && i === scarfIdx) b.classList.add('sel');
      b.addEventListener('click', () => {
        if (owned) { pending = null; shopMsg(''); scarfIdx = i; store.set('dl-scarf', String(i)); renderMenu(); tone(660, 0.08, 'triangle', 0.12); return; }
        if (bank < sc.cost) { tooPoor(sc.cost); renderMenu(); return; }
        if (pending !== key) { pending = key; shopMsg('Nochmal tippen zum Kaufen'); renderMenu(); return; }
        buy(sc.cost); scarfMask |= (1 << i); store.set('dl-scarfmask', String(scarfMask));
        scarfIdx = i; store.set('dl-scarf', String(i)); pending = null; shopMsg('Schal gekauft!'); renderMenu();
      });
      d.appendChild(b);
      const l = document.createElement('span');
      l.innerHTML = owned ? '&nbsp;' : (pending === key ? 'Kaufen?' : `${COIN}${fmt(sc.cost)}`);
      d.appendChild(l);
      wrap.appendChild(d);
    });

    const ww = $('worlds');
    ww.innerHTML = '';
    WORLDS.forEach((w, i) => {
      const owned = !!(worldMask & (1 << i));
      const key = 'w' + i;
      const b = document.createElement('button');
      b.style.background = `linear-gradient(160deg, ${w.sky[1]}, ${w.sky[3]})`;
      if (owned) {
        b.textContent = w.name;
        if (i === startWorld) b.classList.add('sel');
      } else {
        b.classList.add('locked');
        if (pending === key) { b.classList.add('confirm'); b.innerHTML = `Kaufen?<br>${COIN}${fmt(w.cost)}`; }
        else b.innerHTML = `${w.name}<br>${COIN}${fmt(w.cost)}`;
      }
      b.addEventListener('click', () => {
        if (owned) { pending = null; shopMsg(''); startWorld = i; store.set('dl-start', String(i)); reset(); renderMenu(); tone(520, 0.08, 'triangle', 0.12); return; }
        if (bank < w.cost) { tooPoor(w.cost); renderMenu(); return; }
        if (pending !== key) { pending = key; shopMsg('Nochmal tippen zum Kaufen'); renderMenu(); return; }
        buy(w.cost); worldMask |= (1 << i); store.set('dl-worlds', String(worldMask));
        startWorld = i; store.set('dl-start', String(i)); pending = null;
        shopMsg(`${w.name} gehört jetzt dir!`); reset(); renderMenu();
      });
      ww.appendChild(b);
    });
    $('menuStats').innerHTML = `Rekord ${fmt(best)} m &nbsp; ${COIN}${fmt(bank)}`;
  }

  // ---------- Ton ----------
  let ac = null;
  function tone(f, dur = 0.12, type = 'triangle', vol = 0.15, f2) {
    if (muted) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  // ---------- Musik ----------
  // Für jede Welt ein eigener Song, live im Browser erzeugt.
  const SONGS = [
    { bpm: 104, root: 57, chords: [[0,3,7],[-4,0,3],[3,7,10],[-2,2,5]], lead: 'sawtooth', bass: 'triangle', drums: 'synth', arp16: false, arp: [0,1,2,3,2,1,2,1], bassSteps: [0,3,8,11], pad: false },
    { bpm: 124, root: 54, chords: [[0,3,7],[-2,2,5],[-4,0,3],[-2,2,5]], lead: 'square', bass: 'sawtooth', drums: 'four', arp16: true, arp: [0,1,2,3,4,3,2,1], bassSteps: [2,6,10,14], pad: false },
    { bpm: 92, root: 62, chords: [[0,4,7],[5,9,12],[-3,0,4],[7,11,14]], lead: 'triangle', bass: 'sine', drums: 'soft', arp16: false, arp: [3,4,5,4,2,1,2,4], bassSteps: [0,10], pad: true },
    { bpm: 110, root: 52, chords: [[0,3,7],[3,7,10],[5,8,12],[-2,2,5]], lead: 'sine', bass: 'triangle', drums: 'tribal', arp16: true, arp: [0,2,1,3,2,4,3,1], bassSteps: [0,3,8,11,14], pad: false },
    { bpm: 132, root: 50, chords: [[0,3,7],[-4,0,3],[-2,2,5],[-5,-1,2]], lead: 'square', bass: 'square', drums: 'heavy', arp16: true, arp: [0,1,2,1,3,2,1,2], bassSteps: [0,2,4,6,8,10,12,14], pad: false },
    { bpm: 96, root: 60, chords: [[0,4,7],[2,6,9],[4,7,11],[2,6,9]], lead: 'sine', bass: 'sine', drums: 'sparse', arp16: false, arp: [0,2,4,5,4,2,3,1], bassSteps: [0,8], pad: true }
  ];
  let musicBus = null, musicFilter = null, noiseBuf = null, nextTime = 0, step = 0, songIdx = -1;

  function ensureAudio() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      if (!musicBus) {
        musicFilter = ac.createBiquadFilter();
        musicFilter.type = 'lowpass'; musicFilter.frequency.value = 3200;
        musicBus = ac.createGain(); musicBus.gain.value = 0.6;
        musicBus.connect(musicFilter); musicFilter.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        nextTime = ac.currentTime + 0.1;
        setInterval(schedule, 25);
      }
    } catch (e) {}
  }
  function musicMuffle(on) {
    if (!musicFilter) return;
    try { musicFilter.frequency.setTargetAtTime(on ? 650 : 3200, ac.currentTime, 0.25); } catch (e) {}
  }

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function mNote(m, t, dur, type, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = mtof(m);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function mKick(t, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.22);
  }
  function mTom(t, f, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.6, t + 0.15);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.22);
  }
  function mNoise(t, dur, vol, type, freq) {
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(musicBus);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
  }

  function playStep(sg, st, t) {
    const bar = Math.floor(st / 16), s = st % 16;
    const ch = sg.chords[bar % sg.chords.length];
    const stepDur = 60 / sg.bpm / 4;
    const hot = state === 'play' && p && speedAt(p.x) > 540;

    // Bass
    if (sg.bassSteps.includes(s)) mNote(sg.root - 12 + ch[0], t, stepDur * (sg.drums === 'heavy' ? 1.6 : 2.6), sg.bass, sg.bass === 'sawtooth' || sg.bass === 'square' ? 0.07 : 0.16);
    // Arpeggio
    if (sg.arp16 || s % 2 === 0) {
      const idx = sg.arp[(sg.arp16 ? s : s / 2) % sg.arp.length];
      const m = sg.root + 12 + ch[idx % 3] + 12 * Math.floor(idx / 3);
      const dur = sg.lead === 'sine' && sg.drums === 'tribal' ? 0.16 : stepDur * (sg.arp16 ? 1.1 : 1.8);
      mNote(m, t, dur, sg.lead, sg.lead === 'sawtooth' || sg.lead === 'square' ? 0.035 : 0.07);
    }
    // Flächenklang
    if (sg.pad && s === 0) ch.forEach(n => mNote(sg.root + n, t, stepDur * 15, 'sine', 0.035));

    // Schlagzeug
    switch (sg.drums) {
      case 'synth':
        if (s === 0 || s === 8 || s === 10) mKick(t, 0.55);
        if (s === 4 || s === 12) mNoise(t, 0.16, 0.16, 'bandpass', 1800);
        if (s % 4 === 2) mNoise(t, 0.04, 0.06, 'highpass', 7000);
        break;
      case 'four':
        if (s % 4 === 0) mKick(t, 0.6);
        if (s === 4 || s === 12) mNoise(t, 0.12, 0.15, 'bandpass', 1500);
        if (s % 4 === 2) mNoise(t, 0.05, 0.08, 'highpass', 8000);
        break;
      case 'soft':
        if (s === 0) mKick(t, 0.35);
        if (s === 8) mNoise(t, 0.2, 0.05, 'bandpass', 2500);
        if (s % 4 === 2) mNoise(t, 0.03, 0.025, 'highpass', 9000);
        break;
      case 'tribal':
        if (s === 0 || s === 3 || s === 8 || s === 11) mTom(t, 90, 0.5);
        if (s === 6 || s === 14) mTom(t, 180, 0.3);
        mNoise(t, 0.03, s % 2 ? 0.02 : 0.04, 'highpass', 6000);
        break;
      case 'heavy':
        if (s === 0 || s === 2 || s === 8 || s === 10) mKick(t, 0.65);
        if (s === 4 || s === 12) mNoise(t, 0.18, 0.2, 'bandpass', 1300);
        if (s % 2 === 0) mNoise(t, 0.04, 0.06, 'highpass', 7500);
        break;
      case 'sparse':
        if (s === 0) mKick(t, 0.3);
        if (s === 12) mNoise(t, 0.25, 0.03, 'bandpass', 4000);
        break;
    }
    if (hot && s % 2 === 1) mNoise(t, 0.025, 0.03, 'highpass', 9000);
  }

  function schedule() {
    if (!ac || ac.state !== 'running' || !musicBus) return;
    if (!musicOn) { nextTime = ac.currentTime + 0.05; return; }
    if (songIdx !== curWorld) { songIdx = curWorld; step = 0; nextTime = Math.max(nextTime, ac.currentTime + 0.05); }
    if (nextTime < ac.currentTime - 0.2) nextTime = ac.currentTime + 0.05;
    const sg = SONGS[songIdx];
    while (nextTime < ac.currentTime + 0.15) {
      try { playStep(sg, step, nextTime); } catch (e) {}
      nextTime += 60 / sg.bpm / 4;
      step = (step + 1) % 64;
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    try { document.hidden ? ac.suspend() : ac.resume(); } catch (e) {}
  });
  window.addEventListener('pointerdown', ensureAudio, true);
  window.addEventListener('keydown', ensureAudio, true);

  // ---------- Maße ----------
  // Die Spielszene (Dächer und Sprünge) liegt zwischen y≈250 und y≈580 und wird vertikal mittig gezeigt.
  const CENTER_Y = 430;
  let W, H, DPR, S, viewW, viewH, topY, botY;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    S = Math.min(H / 680, W / 520);
    viewW = W / S; viewH = H / S;
    topY = CENTER_Y - viewH / 2;
    botY = topY + viewH;
    initWeather();
  }

  // ---------- Physik ----------
  const GRAV = 2600, JUMP_V = -860, DJ_V = -800, HOLD_G = 0.42, HOLD_MAX = 0.22, FLIP = 0.45;
  const HW = 13, STAND_H = 54, SLIDE_H = 26;

  let state = 'menu';
  let p, roofs, boxes, bars, coins, parts, camX, runCoins, lastMilestone, curWorld = 0, time = 0, hintTimer = 0, deadAt = 0, reason = '';
  const rand = (a, b) => a + Math.random() * (b - a);
  const hash = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
  const speedAt = x => Math.min(700, 330 + Math.max(0, x) * 0.025);
  const meters = () => Math.max(0, Math.floor(p.x / 40));

  // ---------- Wetter ----------
  const weather = { type: 'none', a: 0, flakes: [] };
  function initWeather() {
    weather.flakes = Array.from({ length: 70 }, () => ({ x: Math.random() * (W || 400), y: Math.random() * (H || 800), s: Math.random(), ph: Math.random() * 6.28 }));
  }
  function setWeather(type) {
    if (weather.type === type) return;
    weather.type = type; weather.a = 0; initWeather();
  }

  function reset() {
    p = { x: 0, y: 520, vy: 0, onGround: true, canDouble: false, sliding: false, slideT: 0, slideHeld: false,
          holding: false, holdT: 0, flipT: 0, phase: 0, sinceGround: 0, buffer: 0, rot: 0, vx: 0, scarf: [] };
    for (let i = 0; i < 7; i++) p.scarf.push({ x: p.x - i * 7, y: p.y - 40 });
    roofs = [{ x: -400, w: 1400, y: 520, seed: 1 }];
    boxes = []; bars = []; coins = []; parts = [];
    runCoins = 0; lastMilestone = 0;
    curWorld = startWorld;
    pal = palOf(WORLDS[curWorld]); targetPal = palOf(WORLDS[curWorld]);
    weather.type = ''; setWeather(WORLDS[curWorld].weather); weather.a = 1;
    camX = p.x - viewW * 0.25;
    ensureWorld();
    $('dist').innerHTML = '0<small>m</small>';
    $('coins').innerHTML = `${COIN}0`;
  }

  function addRoof() {
    const last = roofs[roofs.length - 1];
    const end = last.x + last.w;
    const spd = speedAt(end);
    const d = Math.min(1, end / 18000);
    const gap = rand(80, Math.min(260, spd * 0.5));
    const dy = rand(-(gap > 160 ? 50 : 100), 110);
    const y = Math.max(400, Math.min(580, last.y + dy));
    const w = rand(460, 950);
    const r = { x: end + gap, w, y, seed: Math.random() * 1000 };

    if (Math.random() < 0.6) {
      const x0 = end - 30, x1 = r.x + 40, base = Math.min(last.y, y) - 50;
      for (let i = 0; i < 5; i++) {
        const k = i / 4;
        coins.push({ x: x0 + (x1 - x0) * k, y: base - Math.sin(k * Math.PI) * 80 });
      }
    }
    roofs.push(r);

    let pos = r.x + 200;
    while (pos < r.x + w - 200) {
      const q = Math.random();
      if (q < 0.25 + 0.3 * d) {
        const t = Math.random();
        const h = t < 0.5 ? 38 : t < 0.8 ? 64 : 92;
        const bw = h > 60 ? rand(80, 130) : rand(48, 90);
        boxes.push({ x: pos, w: bw, y: r.y - h, h });
        if (h > 60) for (let i = 0; i < 3; i++) coins.push({ x: pos + bw / 2 + (i - 1) * 28, y: r.y - h - 34 });
        pos += bw;
      } else if (q < 0.42 + 0.35 * d && end > 700) {
        bars.push({ x: pos, w: 70, bottom: r.y - 36 });
        for (let i = 0; i < 3; i++) coins.push({ x: pos + 35 + (i - 1) * 30, y: r.y - 14 });
        pos += 70;
      } else if (q < 0.75) {
        for (let i = 0; i < 4; i++) coins.push({ x: pos + i * 36, y: r.y - 40 });
        pos += 110;
      }
      pos += rand(280, 440) + spd * 0.25;
    }
  }

  function ensureWorld() {
    let last = roofs[roofs.length - 1];
    while (last.x + last.w < camX + viewW + 700) { addRoof(); last = roofs[roofs.length - 1]; }
    const cut = camX - 500;
    roofs = roofs.filter(r => r.x + r.w > cut);
    boxes = boxes.filter(b => b.x + b.w > cut);
    bars = bars.filter(b => b.x + b.w > cut);
    coins = coins.filter(c => c.x > cut && !c.got);
  }

  // ---------- Steuerung ----------
  function jumpPress() {
    if (state !== 'play') return;
    p.holding = true;
    if (p.onGround || p.sinceGround < 0.09) {
      p.vy = JUMP_V; p.onGround = false; p.sinceGround = 1; p.holdT = 0; p.canDouble = true;
      p.sliding = false; p.slideT = 0;
      tone(380, 0.12, 'square', 0.06, 760);
      dust(p.x, p.y, 5);
    } else if (p.canDouble) {
      p.vy = DJ_V; p.canDouble = false; p.holdT = 0; p.flipT = FLIP;
      tone(520, 0.14, 'square', 0.06, 1100);
      buzz(12);
      for (let i = 0; i < 8; i++) parts.push({ x: p.x, y: p.y - 10, vx: rand(-120, 120), vy: rand(40, 160), life: 0.4, max: 0.4, c: '#ffffff', s: 3 });
    } else {
      p.buffer = 0.12;
    }
  }
  function jumpRelease() { p && (p.holding = false); }
  function slidePress() {
    if (state !== 'play') return;
    p.slideHeld = true;
    if (p.onGround) startSlide();
    else p.vy = Math.max(p.vy, 1100);
  }
  function slideRelease() { p && (p.slideHeld = false); }
  function startSlide() {
    if (!p.sliding) { tone(300, 0.15, 'sawtooth', 0.04, 140); dust(p.x - 10, p.y, 4); }
    p.sliding = true; p.slideT = 0.45;
  }

  const pointers = new Map();
  window.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    if (state === 'menu') { start(); return; }
    if (state === 'over') { if (performance.now() - deadAt > 900) start(); return; }
    if (state !== 'play') return;
    const zone = e.clientX < W / 2 ? 'slide' : 'jump';
    pointers.set(e.pointerId, zone);
    zone === 'jump' ? jumpPress() : slidePress();
  });
  const up = e => {
    const z = pointers.get(e.pointerId);
    pointers.delete(e.pointerId);
    if (z === 'jump') jumpRelease();
    if (z === 'slide') slideRelease();
  };
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.code;
    if (['Space', 'ArrowUp', 'KeyW', 'ArrowDown', 'KeyS', 'Enter'].includes(k)) e.preventDefault();
    if (state === 'menu' && (k === 'Space' || k === 'Enter')) { start(); return; }
    if (state === 'over' && (k === 'Space' || k === 'Enter') && performance.now() - deadAt > 600) { start(); return; }
    if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') jumpPress();
    if (k === 'ArrowDown' || k === 'KeyS') slidePress();
  });
  window.addEventListener('keyup', e => {
    const k = e.code;
    if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') jumpRelease();
    if (k === 'ArrowDown' || k === 'KeyS') slideRelease();
  });

  $('again').addEventListener('click', () => start());
  $('toMenu').addEventListener('click', () => {
    reset(); state = 'menu'; renderMenu(); musicMuffle(false);
    $('over').classList.add('hidden'); $('menu').classList.remove('hidden');
  });
  $('music').addEventListener('click', () => {
    musicOn = !musicOn; store.set('dl-music', musicOn ? '1' : '0'); setMusicIcon();
  });
  $('mute').addEventListener('click', () => {
    muted = !muted; store.set('dl-muted', muted ? '1' : '0'); setMuteIcon();
  });

  function start() {
    reset();
    state = 'play';
    pointers.clear();
    $('menu').classList.add('hidden');
    $('over').classList.add('hidden');
    $('hud').classList.remove('hidden');
    $('hints').classList.remove('hidden');
    hintTimer = 3.5;
    tone(440, 0.1, 'triangle', 0.1, 660);
    musicMuffle(false);
    popText(WORLDS[curWorld].name, 'Welt');
  }

  function die(why, fell) {
    if (state !== 'play') return;
    reason = why;
    state = 'dying';
    deadAt = performance.now();
    p.sliding = false;
    if (!fell) { p.vy = -520; p.vx = -160; }
    tone(220, 0.45, 'sawtooth', 0.12, 55);
    buzz([40, 40, 100]);
    if (!fell) for (let i = 0; i < 14; i++) parts.push({ x: p.x + 10, y: p.y - 27, vx: rand(-260, 120), vy: rand(-300, 100), life: 0.6, max: 0.6, c: '#fff4e0', s: 4 });
    setTimeout(showOver, fell ? 450 : 950);
  }

  function showOver() {
    state = 'over';
    deadAt = performance.now();
    const m = meters();
    const isNew = m > best;
    if (isNew) { best = m; store.set('dl-best', String(best)); }
    bank += runCoins; store.set('dl-coins', String(bank));
    $('reason').textContent = `${reason} in ${WORLDS[curWorld].name}`;
    $('finalDist').textContent = `${m} m`;
    $('overBest').textContent = isNew && m > 0 ? 'Neuer Rekord!' : `Rekord: ${best} m`;
    $('overCoins').innerHTML = `+${runCoins} ${COIN}gesamt ${fmt(bank)}`;
    let msg = '';
    const nextW = WORLDS.find((w, i) => !(worldMask & (1 << i)));
    const nextS = SCARVES.find((x, i) => !(scarfMask & (1 << i)));
    if (nextW && bank >= nextW.cost) msg = `Du kannst dir jetzt ${nextW.name} kaufen!`;
    else if (nextS && bank >= nextS.cost) msg = 'Du kannst dir einen neuen Schal kaufen!';
    else if (nextW) msg = `Noch ${fmt(nextW.cost - bank)} Münzen bis ${nextW.name}`;
    else if (nextS) msg = `Noch ${fmt(nextS.cost - bank)} Münzen bis zum nächsten Schal`;
    $('unlock').textContent = msg;
    musicMuffle(true);
    pending = null; shopMsg('');
    $('hud').classList.add('hidden');
    $('hints').classList.add('hidden');
    $('over').classList.remove('hidden');
  }

  function dust(x, y, n) {
    for (let i = 0; i < n; i++) parts.push({ x: x + rand(-8, 8), y: y - 2, vx: rand(-140, 40), vy: rand(-120, -20), life: 0.45, max: 0.45, c: 'rgba(255,255,255,.7)', s: rand(2, 4) });
  }

  function popText(t, sub) {
    const el = $('pop');
    el.innerHTML = (sub ? `<small>${sub}</small>` : '') + t;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  }

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    if (state === 'play') {
      const spd = speedAt(p.x);
      const prevY = p.y, prevX = p.x;
      let g = GRAV * WORLDS[curWorld].grav;
      if (p.holding && p.vy < 0 && p.holdT < HOLD_MAX) { g *= HOLD_G; p.holdT += dt; }
      p.vy = Math.min(p.vy + g * dt, 1600);
      p.y += p.vy * dt;
      if (p.flipT > 0) p.flipT = Math.max(0, p.flipT - dt);
      if (p.buffer > 0) p.buffer -= dt;

      const wasGround = p.onGround;
      p.onGround = false;
      const solids = roofs.concat(boxes);
      for (const s of solids) {
        if (p.x + HW > s.x && p.x - HW < s.x + s.w && prevY <= s.y + 0.5 && p.y >= s.y && p.vy >= 0) {
          if (!wasGround && p.vy > 500) { dust(p.x, s.y, 6); tone(110, 0.08, 'sine', 0.08); }
          p.y = s.y; p.vy = 0; p.onGround = true; p.flipT = 0;
        }
      }

      p.x += spd * dt;
      for (const s of solids) {
        if (prevX + HW <= s.x + 0.01 && p.x + HW > s.x && p.y > s.y + 0.5) {
          if (p.y - s.y <= 14) { p.y = s.y; p.vy = 0; p.onGround = true; }
          else { p.x = s.x - HW; die('Gegen die Wand'); return; }
        }
      }

      if (p.onGround) {
        p.sinceGround = 0; p.canDouble = false;
        if (p.buffer > 0) { p.buffer = 0; jumpPress(); }
        else if (p.slideHeld && !p.sliding) startSlide();
      } else p.sinceGround += dt;

      if (p.sliding) {
        p.slideT -= dt;
        const underBar = bars.some(b => p.x + HW + 20 > b.x && p.x - HW < b.x + b.w);
        if (!p.onGround || (p.slideT <= 0 && !p.slideHeld && !underBar)) p.sliding = false;
      }

      const h = p.sliding ? SLIDE_H : (p.onGround ? STAND_H : 46);
      for (const b of bars) {
        if (p.x + HW > b.x && p.x - HW < b.x + b.w && p.y - h < b.bottom) { die('Schild übersehen'); return; }
      }

      for (const c of coins) {
        if (c.got) continue;
        const dx = c.x - p.x, dy = c.y - (p.y - h / 2);
        if (dx * dx + dy * dy < 30 * 30) {
          c.got = true; runCoins++;
          $('coins').innerHTML = `${COIN}${runCoins}`;
          tone(988, 0.06, 'square', 0.05);
          setTimeout(() => tone(1319, 0.1, 'square', 0.05), 55);
          for (let i = 0; i < 5; i++) parts.push({ x: c.x, y: c.y, vx: rand(-90, 90), vy: rand(-140, 20), life: 0.35, max: 0.35, c: '#ffd23f', s: 3 });
        }
      }

      if (p.y > botY + 120) { die('Zwischen die Häuser gefallen', true); return; }

      p.phase += spd * dt * 0.034;
      camX += ((p.x - viewW * 0.25) - camX) * Math.min(1, dt * 12);
      ensureWorld();

      const m = meters();
      $('dist').innerHTML = `${m}<small>m</small>`;
      if (Math.floor(m / 100) > lastMilestone) {
        lastMilestone = Math.floor(m / 100);
        popText(`${lastMilestone * 100} m`);
        [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'triangle', 0.1), i * 70));
        buzz(20);
      }
      if (hintTimer > 0) { hintTimer -= dt; if (hintTimer <= 0) $('hints').classList.add('hidden'); }
    } else if (state === 'dying') {
      p.vy += GRAV * dt; p.y += p.vy * dt; p.x += p.vx * dt; p.rot -= 9 * dt;
    }

    // Farben gleiten in die neue Welt
    const k = Math.min(1, dt * 1.2);
    pal.sky.forEach((c, i) => lerp3(c, targetPal.sky[i], k));
    KEYS.forEach(key => lerp3(pal[key], targetPal[key], k));
    pal.sunR += (targetPal.sunR - pal.sunR) * k;
    pal.stars += (targetPal.stars - pal.stars) * k;

    for (const q of parts) { q.life -= dt; q.vy += 600 * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
    parts = parts.filter(q => q.life > 0);

    updateWeather(dt);

    const nx = p.x + (p.sliding ? -18 : 4), ny = p.y - (p.sliding ? 18 : 39);
    p.scarf[0].x = nx; p.scarf[0].y = ny;
    for (let i = 1; i < p.scarf.length; i++) {
      const a = p.scarf[i - 1], b = p.scarf[i];
      const tx = a.x - 7, ty = a.y + 1.5 + Math.sin(time * 14 + i * 0.9) * 2.2;
      b.x += (tx - b.x) * 0.55; b.y += (ty - b.y) * 0.55;
    }
  }

  function updateWeather(dt) {
    weather.a = Math.min(1, weather.a + dt * 0.8);
    const moving = state === 'play' ? 1 : 0.3;
    for (const f of weather.flakes) {
      switch (weather.type) {
        case 'rain': f.x += (-160 - 200 * moving) * dt; f.y += (850 + f.s * 300) * dt; break;
        case 'snow': f.y += (30 + f.s * 50) * dt; f.x += (Math.sin(time * 1.5 + f.ph) * 25 - 80 * moving) * dt; break;
        case 'fireflies': f.x += (Math.sin(time * 0.8 + f.ph) * 30 - 40 * moving) * dt; f.y += Math.cos(time * 0.9 + f.ph * 1.3) * 25 * dt; break;
        case 'embers': f.y -= (40 + f.s * 50) * dt; f.x += (Math.sin(time * 2 + f.ph) * 30 - 70 * moving) * dt; break;
      }
      if (f.y > H + 20) { f.y = -20; f.x = Math.random() * (W + 200); }
      if (f.y < -20) { f.y = H + 20; f.x = Math.random() * W; }
      if (f.x < -30) { f.x = W + 20; f.y = Math.random() * H; }
      if (f.x > W + 220) f.x = -20;
    }
  }

  // ---------- Zeichnen ----------
  function drawSky() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const horizon = Math.max(40, (560 - topY) * S);
    const g = ctx.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0, rgb(pal.sky[0]));
    g.addColorStop(0.55, rgb(pal.sky[1]));
    g.addColorStop(0.85, rgb(pal.sky[2]));
    g.addColorStop(1, rgb(pal.sky[3]));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    if (pal.stars > 0.02) {
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 60; i++) {
        const sx = hash(i, 3) * W, sy = hash(i, 7) * horizon * 0.65;
        ctx.globalAlpha = pal.stars * (0.25 + 0.5 * (0.5 + 0.5 * Math.sin(time * 1.5 + i)));
        ctx.fillRect(sx, sy, 1.7, 1.7);
      }
      ctx.globalAlpha = 1;
    }
  }

  function worldT(par) {
    ctx.setTransform(DPR * S, 0, 0, DPR * S, -camX * par * DPR * S, -topY * DPR * S);
  }

  function drawSkyline(par, slot, base, minH, maxH, col, win, seed) {
    worldT(par);
    const off = camX * par;
    const i0 = Math.floor(off / slot) - 1, i1 = Math.ceil((off + viewW) / slot) + 1;
    for (let i = i0; i <= i1; i++) {
      const h = minH + hash(i, seed) * (maxH - minH);
      const x = i * slot + hash(i, seed + 1) * 10, w = slot - 6 - hash(i, seed + 2) * 14;
      ctx.fillStyle = col;
      ctx.fillRect(x, base - h, w, botY - base + h + 10);
      if (hash(i, seed + 3) > 0.7) ctx.fillRect(x + w * 0.4, base - h - 22, 3, 22);
      if (win) {
        ctx.fillStyle = rgb(pal.win, 0.55);
        for (let yy = base - h + 14; yy < botY; yy += 22)
          for (let xx = x + 8; xx < x + w - 10; xx += 16)
            if (hash(i * 31 + xx * 0.7 + yy, seed) > 0.78) ctx.fillRect(xx, yy, 6, 9);
      }
    }
  }

  function drawWorld() {
    worldT(0.02);
    ctx.fillStyle = rgb(pal.sun, 0.85);
    ctx.beginPath(); ctx.arc(camX * 0.02 + viewW * 0.68, 450, pal.sunR, 0, 6.283); ctx.fill();

    drawSkyline(0.12, 70, 560, 90, 300, rgb(pal.far), false, 11);
    drawSkyline(0.32, 110, 620, 60, 260, rgb(pal.near), true, 23);

    worldT(1);
    const roofCol = rgb(pal.roof), edgeCol = rgb(pal.edge), lipCol = rgb(pal.lip);
    const litCol = rgb(pal.rwin, 0.5), darkWin = 'rgba(255,255,255,.04)';
    for (const r of roofs) {
      if (r.x > camX + viewW + 50 || r.x + r.w < camX - 50) continue;
      ctx.fillStyle = roofCol;
      ctx.fillRect(r.x, r.y, r.w, botY - r.y + 10);
      ctx.fillStyle = edgeCol;
      ctx.fillRect(r.x - 4, r.y, r.w + 8, 7);
      ctx.fillStyle = lipCol;
      ctx.fillRect(r.x, r.y + 7, r.w, 5);
      for (let yy = r.y + 36; yy < botY; yy += 46)
        for (let xx = r.x + 24; xx < r.x + r.w - 30; xx += 54) {
          ctx.fillStyle = hash(xx * 0.13 + yy, r.seed) > 0.72 ? litCol : darkWin;
          ctx.fillRect(xx, yy, 18, 24);
        }
    }
    const boxCol = rgb(pal.box), boxTop = rgb(pal.boxTop);
    for (const b of boxes) {
      ctx.fillStyle = boxCol;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = boxTop;
      ctx.fillRect(b.x, b.y, b.w, 6);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      for (let yy = b.y + 14; yy < b.y + b.h - 6; yy += 9) ctx.fillRect(b.x + 8, yy, b.w - 16, 3);
    }
    for (const b of bars) {
      ctx.strokeStyle = rgb(pal.cable); ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(b.x + 12, topY); ctx.lineTo(b.x + 12, b.bottom - 44);
      ctx.moveTo(b.x + b.w - 12, topY); ctx.lineTo(b.x + b.w - 12, b.bottom - 44);
      ctx.stroke();
      ctx.save();
      ctx.beginPath(); ctx.rect(b.x, b.bottom - 44, b.w, 44); ctx.clip();
      ctx.fillStyle = rgb(pal.sign); ctx.fillRect(b.x, b.bottom - 44, b.w, 44);
      ctx.fillStyle = rgb(pal.stripe);
      for (let k = -60; k < b.w + 60; k += 22) {
        ctx.beginPath();
        ctx.moveTo(b.x + k, b.bottom); ctx.lineTo(b.x + k + 11, b.bottom);
        ctx.lineTo(b.x + k + 55, b.bottom - 44); ctx.lineTo(b.x + k + 44, b.bottom - 44);
        ctx.fill();
      }
      ctx.restore();
    }
    for (const c of coins) {
      if (c.got) continue;
      const sx = Math.abs(Math.cos(time * 4 + c.x * 0.02)) * 0.85 + 0.15;
      ctx.save(); ctx.translate(c.x, c.y); ctx.scale(sx, 1);
      ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#b07a12'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, 6.283); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff1a8'; ctx.fillRect(-2, -5, 4, 10);
      ctx.restore();
    }

    drawRunner();

    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.c;
      ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s);
    }
    ctx.globalAlpha = 1;
  }

  function drawWeather() {
    if (weather.type === 'none') return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const a = weather.a;
    for (const f of weather.flakes) {
      switch (weather.type) {
        case 'rain':
          ctx.strokeStyle = `rgba(120,240,255,${0.35 * a})`; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - 4, f.y + 16); ctx.stroke(); break;
        case 'snow':
          ctx.fillStyle = `rgba(255,255,255,${0.8 * a})`;
          ctx.beginPath(); ctx.arc(f.x, f.y, 1.4 + f.s * 2, 0, 6.283); ctx.fill(); break;
        case 'fireflies': {
          const b = 0.5 + 0.5 * Math.sin(time * 3 + f.ph * 4);
          ctx.fillStyle = `rgba(255,240,120,${0.15 * b * a})`;
          ctx.beginPath(); ctx.arc(f.x, f.y, 7, 0, 6.283); ctx.fill();
          ctx.fillStyle = `rgba(255,250,180,${0.9 * b * a})`;
          ctx.beginPath(); ctx.arc(f.x, f.y, 1.8, 0, 6.283); ctx.fill(); break;
        }
        case 'embers':
          ctx.fillStyle = `rgba(255,${120 + (f.s * 100) | 0},40,${(0.4 + 0.5 * f.s) * a})`;
          ctx.fillRect(f.x, f.y, 2.5, 2.5); break;
      }
    }
  }

  function scarfColor() {
    const s = SCARVES[scarfIdx];
    return s.c === 'rainbow' ? `hsl(${(time * 160) % 360},90%,62%)` : s.c;
  }

  function limb(pts) {
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  function pose() {
    let hip, neck, head, legs, arms;
    if (state === 'menu') {
      hip = { x: 0, y: -22 }; neck = { x: 1, y: -40 }; head = { x: 2, y: -48 };
      legs = [[hip, { x: -3, y: -11 }, { x: -4, y: 0 }], [hip, { x: 4, y: -11 }, { x: 5, y: 0 }]];
      const sh = { x: 1, y: -36 };
      arms = [[sh, { x: -4, y: -27 }, { x: -3, y: -18 }], [sh, { x: 6, y: -27 }, { x: 6, y: -18 }]];
    } else if (p.sliding && p.onGround) {
      hip = { x: -4, y: -7 }; neck = { x: -18, y: -18 }; head = { x: -24, y: -23 };
      legs = [[hip, { x: 8, y: -5 }, { x: 21, y: -2 }], [hip, { x: 6, y: -2 }, { x: 18, y: -1 }]];
      const sh = { x: -16, y: -16 };
      arms = [[sh, { x: -22, y: -7 }, { x: -26, y: -1 }], [sh, { x: -8, y: -14 }, { x: 0, y: -16 }]];
    } else if (!p.onGround) {
      hip = { x: 0, y: -22 }; neck = { x: 3, y: -40 }; head = { x: 5, y: -48 };
      legs = [[hip, { x: 11, y: -16 }, { x: 5, y: -6 }], [hip, { x: -2, y: -11 }, { x: -11, y: -6 }]];
      const sh = { x: 3, y: -36 };
      arms = [[sh, { x: 13, y: -43 }, { x: 19, y: -51 }], [sh, { x: -6, y: -43 }, { x: -10, y: -52 }]];
    } else {
      const ph = p.phase;
      hip = { x: 0, y: -22 - Math.abs(Math.cos(ph)) * 2 };
      neck = { x: 6, y: hip.y - 18 }; head = { x: 9, y: neck.y - 8 };
      legs = []; arms = [];
      for (const off of [0, Math.PI]) {
        const a = Math.sin(ph + off) * 0.95;
        const knee = { x: hip.x + Math.sin(a) * 12, y: hip.y + Math.cos(a) * 12 };
        const bend = 0.25 + 1.1 * Math.max(0, -Math.cos(ph + off));
        const foot = { x: knee.x + Math.sin(a - bend) * 12, y: knee.y + Math.cos(a - bend) * 12 };
        legs.push([hip, knee, foot]);
        const sh = { x: 5, y: hip.y - 14 };
        const b = -Math.sin(ph + off) * 1.0;
        const el = { x: sh.x + Math.sin(b) * 10, y: sh.y + Math.cos(b) * 10 };
        const hd = { x: el.x + Math.sin(b + 1.6) * 9, y: el.y + Math.cos(b + 1.6) * 9 };
        arms.push([sh, el, hd]);
      }
    }
    return { hip, neck, head, legs, arms };
  }

  function drawRunner() {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // Schal mit dunkler Kontur
    for (const [col, lw] of [['rgba(0,0,0,.35)', 8], [scarfColor(), 5]]) {
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(p.scarf[0].x, p.scarf[0].y);
      for (let i = 1; i < p.scarf.length; i++) ctx.lineTo(p.scarf[i].x, p.scarf[i].y);
      ctx.stroke();
    }

    ctx.save();
    ctx.translate(p.x, p.y);
    if (state === 'dying') { ctx.translate(0, -27); ctx.rotate(p.rot); ctx.translate(0, 27); }
    else if (p.flipT > 0) { const k = 1 - p.flipT / FLIP; ctx.translate(0, -27); ctx.rotate(k * Math.PI * 2); ctx.translate(0, 27); }

    const { hip, neck, head, legs, arms } = pose();
    // Kontur
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 10;
    legs.forEach(limb); arms.forEach(limb); limb([hip, neck]);
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath(); ctx.arc(head.x, head.y, 10, 0, 6.283); ctx.fill();
    // Körper
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#c9bfe0';
    limb(legs[1]); limb(arms[1]);
    ctx.strokeStyle = '#fff4e0';
    limb([hip, neck]);
    limb(legs[0]);
    ctx.fillStyle = '#fff4e0';
    ctx.beginPath(); ctx.arc(head.x, head.y, 8, 0, 6.283); ctx.fill();
    ctx.strokeStyle = scarfColor(); ctx.lineWidth = 5;
    limb([{ x: neck.x - 4, y: neck.y + 1 }, { x: neck.x + 4, y: neck.y + 1 }]);
    ctx.strokeStyle = '#fff4e0'; ctx.lineWidth = 6;
    limb(arms[0]);
    ctx.restore();
  }

  // ---------- Schleife ----------
  let last = 0;
  function loop(t) {
    const dt = Math.min(0.033, (t - last) / 1000 || 0);
    last = t;
    update(dt);
    drawSky();
    drawWorld();
    drawWeather();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', () => { resize(); if (state === 'menu') camX = p.x - viewW * 0.25; });
  resize();
  reset();
  renderMenu();
  requestAnimationFrame(loop);
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
